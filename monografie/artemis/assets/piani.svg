<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 635" role="img" aria-labelledby="t d"><title id="t">LE MISSIONI: PIANO STORICO E REVISIONE 2026</title><desc id="d">La numerazione non garantisce automaticamente la data o il completamento.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67c7ff"/></marker></defs><rect width="1000" height="635" fill="#0c1520"/><g font-family="Arial,sans-serif"><text x="35" y="48" fill="#f3f5f7" font-size="26">LE MISSIONI: PIANO STORICO E REVISIONE 2026</text><rect x="35" y="85" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="119" fill="#f5b941" font-size="23">Artemis I · risultato</text><text x="60" y="153" fill="#f3f5f7" font-size="20">Prova senza equipaggio conclusa nel dicembre 2022.</text><path d="M500 180V199" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="205" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="239" fill="#f5b941" font-size="23">Artemis II · risultato</text><text x="60" y="273" fill="#f3f5f7" font-size="20">Volo umano attorno alla Luna concluso nell’aprile 2026.</text><path d="M500 300V319" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="325" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="359" fill="#f5b941" font-size="23">Artemis III · obiettivo 2027</text><text x="60" y="393" fill="#f3f5f7" font-size="20">Prova integrata in orbita terrestre, non allunaggio.</text><path d="M500 420V439" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="445" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="479" fill="#f5b941" font-size="23">Artemis IV · obiettivo 2028</text><text x="60" y="513" fill="#f3f5f7" font-size="20">Missione di allunaggio, subordinata alle capacità richieste.</text><text x="35" y="582" fill="#aab4be" font-size="16">La numerazione non garantisce automaticamente la data o il completamento.</text><text x="35" y="615" fill="#aab4be" font-size="15">Rivoluzione Spaziale · illustrazione originale · CC BY 4.0</text></g></svg>