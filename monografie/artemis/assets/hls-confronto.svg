<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 515" role="img" aria-labelledby="t d"><title id="t">DUE STRADE PER IL LANDER</title><desc id="d">Confronto di funzioni; non assegna un vincitore né confronta prezzi per volo.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67c7ff"/></marker></defs><rect width="1000" height="515" fill="#0c1520"/><g font-family="Arial,sans-serif"><text x="35" y="48" fill="#f3f5f7" font-size="26">DUE STRADE PER IL LANDER</text><rect x="35" y="85" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="119" fill="#f5b941" font-size="23">SpaceX · Starship HLS</text><text x="60" y="153" fill="#f3f5f7" font-size="20">Variante lunare di una famiglia di veicoli molto grande.</text><path d="M500 180V199" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="205" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="239" fill="#f5b941" font-size="23">Blue Origin · Blue Moon Mark 2</text><text x="60" y="273" fill="#f3f5f7" font-size="20">Lander umano distinto dal dimostratore cargo Mark 1.</text><path d="M500 300V319" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="325" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="359" fill="#f5b941" font-size="23">Requisiti comuni</text><text x="60" y="393" fill="#f3f5f7" font-size="20">Incontro, persone, superficie e risalita; campagne preparatorie proprie.</text><text x="35" y="462" fill="#aab4be" font-size="16">Confronto di funzioni; non assegna un vincitore né confronta prezzi per volo.</text><text x="35" y="495" fill="#aab4be" font-size="15">Rivoluzione Spaziale · illustrazione originale · CC BY 4.0</text></g></svg>