<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 635" role="img" aria-labelledby="t d"><title id="t">SLS: ELEMENTI DELLA CONFIGURAZIONE INIZIALE</title><desc id="d">Ordine funzionale dall’alto; non è un disegno in scala.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67c7ff"/></marker></defs><rect width="1000" height="635" fill="#0c1520"/><g font-family="Arial,sans-serif"><text x="35" y="48" fill="#f3f5f7" font-size="26">SLS: ELEMENTI DELLA CONFIGURAZIONE INIZIALE</text><rect x="35" y="85" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="119" fill="#f5b941" font-size="23">Orion e sistema di fuga</text><text x="60" y="153" fill="#f3f5f7" font-size="20">Equipaggio e apparati di sicurezza.</text><path d="M500 180V199" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="205" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="239" fill="#f5b941" font-size="23">Stadio superiore</text><text x="60" y="273" fill="#f3f5f7" font-size="20">Spinta necessaria alla fase successiva del viaggio.</text><path d="M500 300V319" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="325" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="359" fill="#f5b941" font-size="23">Stadio centrale</text><text x="60" y="393" fill="#f3f5f7" font-size="20">Serbatoi e quattro RS-25 a propellenti liquidi.</text><path d="M500 420V439" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="445" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="479" fill="#f5b941" font-size="23">Due booster solidi</text><text x="60" y="513" fill="#f3f5f7" font-size="20">Spinta nella prima parte della salita.</text><text x="35" y="582" fill="#aab4be" font-size="16">Ordine funzionale dall’alto; non è un disegno in scala.</text><text x="35" y="615" fill="#aab4be" font-size="15">Rivoluzione Spaziale · illustrazione originale · CC BY 4.0</text></g></svg>