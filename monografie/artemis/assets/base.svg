<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 635" role="img" aria-labelledby="t d"><title id="t">UNA BASE NON È SOLO UN HABITAT</title><desc id="d">Dipendenze funzionali: nessuna data di completamento viene garantita.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67c7ff"/></marker></defs><rect width="1000" height="635" fill="#0c1520"/><g font-family="Arial,sans-serif"><text x="35" y="48" fill="#f3f5f7" font-size="26">UNA BASE NON È SOLO UN HABITAT</text><rect x="35" y="85" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="119" fill="#f5b941" font-size="23">Preparazione</text><text x="60" y="153" fill="#f3f5f7" font-size="20">Conoscere il sito e consegnare strumenti.</text><path d="M500 180V199" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="205" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="239" fill="#f5b941" font-size="23">Infrastrutture iniziali</text><text x="60" y="273" fill="#f3f5f7" font-size="20">Energia, comunicazioni, mobilità e logistica.</text><path d="M500 300V319" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="325" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="359" fill="#f5b941" font-size="23">Operazioni ricorrenti</text><text x="60" y="393" fill="#f3f5f7" font-size="20">Equipaggi, manutenzione e rifornimenti.</text><path d="M500 420V439" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="445" width="930" height="92" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="479" fill="#f5b941" font-size="23">Presenza prolungata</text><text x="60" y="513" fill="#f3f5f7" font-size="20">Risorse e sistemi con margini per guasti e ritardi.</text><text x="35" y="582" fill="#aab4be" font-size="16">Dipendenze funzionali: nessuna data di completamento viene garantita.</text><text x="35" y="615" fill="#aab4be"