<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 660" role="img" aria-labelledby="title desc">
<title id="title">Capsula e trunk: schema funzionale Crew Dragon</title>
<desc id="desc">Disegno semplificato: cono anteriore e attracco in alto, cabina pressurizzata al centro, scudo termico sotto la capsula, trunk con energia solare nella parte inferiore. Torna a Terra soltanto la capsula. Non in scala.</desc>
<rect width="900" height="660" fill="#0c1520"/>
<g font-family="Arial,sans-serif" fill="#e7eef4"><text x="35" y="48" font-size="27" font-weight="bold">Due parti, un solo viaggio orbitale</text><text x="35" y="80" font-size="17" fill="#aab4be">Schema divulgativo originale · Non in scala · Nessuna procedura operativa</text></g>
<g stroke="#67c7ff" stroke-width="3"><path d="M245 150 Q325 60 405 150" fill="#223c51"/><path d="M245 150 L150 365 Q325 408 500 365 L405 150 Z" fill="#152a3b"/><path d="M150 365 Q325 408 500 365" fill="none" stroke="#f5b941" stroke-width="12"/><path d="M180 408 L180 570 L470 570 L470 408" fill="#16232e"/><path d="M190 435 L460 435 M190 455 L460 455 M190 475 L460 475 M190 495 L460 495 M230 420 L230 555 M270 420 L270 555 M310 420 L310 555 M350 420 L350 555 M390 420 L390 555 M430 420 L430 555" stroke="#38627b" stroke-width="2"/><path d="M230 270 Q325 185 420 270 L435 345 Q325 368 215 345 Z" fill="#24465d" stroke-dasharray="8 6"/>
<path d="M410 145 L550 145 M438 260 L550 260 M495 377 L550 377" fill="none"/><path d="M470 492 L550 492" fill="none" stroke="#aab4be"/>
</g>
<g font-family="Arial,sans-serif"><g fill="#f5b941" font-size="23" font-weight="bold"><text x="575" y="142">Cono anteriore</text><text x="575" y="253">Cabina</text><text x="575" y="372">Scudo termico</text><text x="575" y="488">Trunk</text></g><g fill="#dce2e7" font-size="19"><text x="575" y="172">Protegge la zona d’attracco.</text><text x="575" y="283">Volume pressurizzato.</text><text x="575" y="313">Qui viaggia l’equipaggio.</text><text x="575" y="402">Protezione nel rientro.</text><text x="575" y="518">Modulo non pressurizzato.</text><text x="575" y="548">Energia solare e funzioni</text><text x="575" y="575">esterne alla cabina.</text></g><text x="35" y="625" font-size="19" fill="#aab4be">La capsula viene recuperata. Il trunk viene separato prima del rientro della cabina.</text></g>
</svg>
