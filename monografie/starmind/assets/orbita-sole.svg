<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">Cercare il Sole vicino al terminatore</title><desc id="desc">Proiezione illustrativa di un’orbita alba-tramonto; stagioni e ombre reali richiedono calcolo orbitale.</desc><rect width="900" height="650" fill="#0c1520"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="58" fill="#f5b941" font-size="32" text-anchor="start">Cercare il Sole vicino al terminatore</text><circle cx="440" cy="312" r="145" fill="#225478"/><path d="M440 167 a145 145 0 0 1 0 290z" fill="#091521"/><ellipse cx="440" cy="312" rx="190" ry="255" fill="none" stroke="#67c7ff" stroke-width="5"/><circle cx="440" cy="57" r="10" fill="#f5b941"/><path d="M65 215 h170 m-15 -10 l15 10 -15 10" stroke="#f5b941" fill="none" stroke-width="4"/><path d="M65 315 h170 m-15 -10 l15 10 -15 10" stroke="#f5b941" fill="none" stroke-width="4"/><path d="M65 415 h170 m-15 -10 l15 10 -15 10" stroke="#f5b941" fill="none" stroke-width="4"/><text x="50" y="150" fill="#f5b941" font-size="27" text-anchor="start">Luce solare</text><text x="660" y="290" fill="#dce2e7" font-size="27" text-anchor="start">Lato</text><text x="660" y="325" fill="#dce2e7" font-size="27" text-anchor="start">notturno</text><text x="40" y="615" fill="#aab4be" font-size="25" text-anchor="start">Orbita al terminatore: schema, non traiettoria AI1.</text></g></svg>