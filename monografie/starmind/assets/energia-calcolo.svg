<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" role="img" aria-labelledby="title desc"><title id="title">Il percorso che il Sole deve alimentare</title><desc id="desc">Catena funzionale; la luce raccolta non equivale alla potenza utile del payload.</desc><rect width="900" height="668" fill="#0c1520"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="58" fill="#f5b941" font-size="32" text-anchor="start">Il percorso che il Sole deve alimentare</text><rect x="40" y="95" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="129" fill="#67c7ff" font-size="28" text-anchor="start">Sole e pannelli</text><text x="62" y="161" fill="#dce2e7" font-size="24" text-anchor="start">La radiazione diventa potenza elettrica.</text><path d="M450 205 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="227" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="261" fill="#67c7ff" font-size="28" text-anchor="start">Conversione e distribuzione</text><text x="62" y="293" fill="#dce2e7" font-size="24" text-anchor="start">Una parte dell’energia si perde prima di arrivare ai chip.</text><path d="M450 337 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="359" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="393" fill="#67c7ff" font-size="28" text-anchor="start">Processori e memoria</text><text x="62" y="425" fill="#dce2e7" font-size="24" text-anchor="start">Il lavoro informatico produce soprattutto calore.</text><path d="M450 469 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="491" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="525" fill="#67c7ff" font-size="28" text-anchor="start">Circuito termico e radiatori</text><text x="62" y="557" fill="#dce2e7" font-size="24" text-anchor="start">Il calore viene trasportato e irradiato verso lo spazio.</text></g></svg>