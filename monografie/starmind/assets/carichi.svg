<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" role="img" aria-labelledby="title desc"><title id="title">Tre lavori che chiedono reti diverse</title><desc id="desc">La convenienza dipende da dati trasferiti, comunicazioni e uso dei processori.</desc><rect width="900" height="536" fill="#0c1520"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="58" fill="#f5b941" font-size="32" text-anchor="start">Tre lavori che chiedono reti diverse</text><rect x="40" y="95" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="129" fill="#67c7ff" font-size="28" text-anchor="start">Inferenza locale</text><text x="62" y="161" fill="#dce2e7" font-size="24" text-anchor="start">Modello già caricato; richieste relativamente piccole.</text><path d="M450 205 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="227" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="261" fill="#67c7ff" font-size="28" text-anchor="start">Addestramento distribuito</text><text x="62" y="293" fill="#dce2e7" font-size="24" text-anchor="start">Sincronizzazione frequente fra gruppi di processori.</text><path d="M450 337 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="359" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="393" fill="#67c7ff" font-size="28" text-anchor="start">Dati prodotti in orbita</text><text x="62" y="425" fill="#dce2e7" font-size="24" text-anchor="start">Elaborazione vicino al sensore, poi risultati verso terra.</text></g></svg>