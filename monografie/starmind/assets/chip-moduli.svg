<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" role="img" aria-labelledby="title desc"><title id="title">Un processore non lavora da solo</title><desc id="desc">Schema generale di una piattaforma di calcolo; non distinta AI1.</desc><rect width="900" height="668" fill="#0c1520"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="58" fill="#f5b941" font-size="32" text-anchor="start">Un processore non lavora da solo</text><rect x="40" y="95" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="129" fill="#67c7ff" font-size="28" text-anchor="start">CPU</text><text x="62" y="161" fill="#dce2e7" font-size="24" text-anchor="start">Prepara dati e coordina le operazioni.</text><path d="M450 205 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="227" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="261" fill="#67c7ff" font-size="28" text-anchor="start">GPU e memoria veloce</text><text x="62" y="293" fill="#dce2e7" font-size="24" text-anchor="start">Eseguono il calcolo parallelo e conservano i dati vicini.</text><path d="M450 337 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="359" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="393" fill="#67c7ff" font-size="28" text-anchor="start">Interconnessioni</text><text x="62" y="425" fill="#dce2e7" font-size="24" text-anchor="start">Spostano informazioni fra unità e nodi.</text><path d="M450 469 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="491" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="525" fill="#67c7ff" font-size="28" text-anchor="start">Alimentazione e controllo</text><text x="62" y="557" fill="#dce2e7" font-size="24" text-anchor="start">Mantengono il sistema entro i limiti elettrici e termici.</text></g></svg>