<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" role="img" aria-labelledby="title desc"><title id="title">Dove passa il calore</title><desc id="desc">Conduzione e trasporto interno, irraggiamento verso l’esterno.</desc><rect width="900" height="668" fill="#0c1520"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="58" fill="#f5b941" font-size="32" text-anchor="start">Dove passa il calore</text><rect x="40" y="95" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="129" fill="#67c7ff" font-size="28" text-anchor="start">Chip → interfaccia termica</text><text x="62" y="161" fill="#dce2e7" font-size="24" text-anchor="start">Il calore deve attraversare materiali e contatti.</text><path d="M450 205 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="227" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="261" fill="#67c7ff" font-size="28" text-anchor="start">Interfaccia → circuito</text><text x="62" y="293" fill="#dce2e7" font-size="24" text-anchor="start">Fluido o altri dispositivi trasportano il calore.</text><path d="M450 337 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="359" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="393" fill="#67c7ff" font-size="28" text-anchor="start">Circuito → radiatore</text><text x="62" y="425" fill="#dce2e7" font-size="24" text-anchor="start">La superficie trasferisce energia sotto forma di infrarosso.</text><path d="M450 469 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="491" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="525" fill="#67c7ff" font-size="28" text-anchor="start">Radiatore → ambiente</text><text x="62" y="557" fill="#dce2e7" font-size="24" text-anchor="start">Sole e Terra possono aggiungere calore assorbito.</text></g></svg>