<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 668" role="img" aria-labelledby="title desc"><title id="title">La fabbrica deve imparare a ripetere</title><desc id="desc">Modello industriale generale, non pianta Gigasat.</desc><rect width="900" height="668" fill="#0c1520"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="58" fill="#f5b941" font-size="32" text-anchor="start">La fabbrica deve imparare a ripetere</text><rect x="40" y="95" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="129" fill="#67c7ff" font-size="28" text-anchor="start">Fornitura</text><text x="62" y="161" fill="#dce2e7" font-size="24" text-anchor="start">Chip, celle, materiali e componenti disponibili.</text><path d="M450 205 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="227" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="261" fill="#67c7ff" font-size="28" text-anchor="start">Assemblaggio</text><text x="62" y="293" fill="#dce2e7" font-size="24" text-anchor="start">Processi misurati, tracciabilità e integrazione.</text><path d="M450 337 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="359" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="393" fill="#67c7ff" font-size="28" text-anchor="start">Verifica</text><text x="62" y="425" fill="#dce2e7" font-size="24" text-anchor="start">Collaudi compatibili con il ritmo della linea.</text><path d="M450 469 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="491" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="525" fill="#67c7ff" font-size="28" text-anchor="start">Feedback dal volo</text><text x="62" y="557" fill="#dce2e7" font-size="24" text-anchor="start">Le anomalie cambiano progetto e produzione.</text></g></svg>