<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 536" role="img" aria-labelledby="title desc"><title id="title">Tre ambienti, tre prove differenti</title><desc id="desc">Una prova locale non dimostra automaticamente un servizio mondiale.</desc><rect width="900" height="536" fill="#0c1520"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="58" fill="#f5b941" font-size="32" text-anchor="start">Tre ambienti, tre prove differenti</text><rect x="40" y="95" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="129" fill="#67c7ff" font-size="28" text-anchor="start">Computer nella ISS</text><text x="62" y="161" fill="#dce2e7" font-size="24" text-anchor="start">Stazione abitata, energia e raffreddamento condivisi.</text><path d="M450 205 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="227" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="261" fill="#67c7ff" font-size="28" text-anchor="start">Dimostratore autonomo</text><text x="62" y="293" fill="#dce2e7" font-size="24" text-anchor="start">Un veicolo prova componenti e carichi di lavoro in orbita.</text><path d="M450 337 v17 m-7 -7 l7 7 7 -7" fill="none" stroke="#f5b941" stroke-width="3"/><rect x="40" y="359" width="820" height="106" rx="10" fill="#132433" stroke="#496b83"/><text x="62" y="393" fill="#67c7ff" font-size="28" text-anchor="start">Rete commerciale</text><text x="62" y="425" fill="#dce2e7" font-size="24" text-anchor="start">Molti nodi devono offrire un servizio ripetibile e sostenibile.</text></g></svg>