<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 650" role="img" aria-labelledby="title desc"><title id="title">Una percentuale piccola su una rete grande</title><desc id="desc">Esempio aritmetico, non previsione di affidabilità Starmind. Lunghezze compresse logaritmicamente.</desc><rect width="900" height="650" fill="#0c1520"/><g font-family="Segoe UI,Arial,sans-serif"><text x="40" y="58" fill="#f5b941" font-size="32" text-anchor="start">Una percentuale piccola su una rete grande</text><text x="40" y="110" fill="#aab4be" font-size="26" text-anchor="start">Esempio: indisponibilità definitiva dell’1%</text><text x="40" y="180" fill="#dce2e7" font-size="25" text-anchor="start">1.000 nodi</text><rect x="300" y="155" width="80.0" height="43" fill="#67c7ff"/><text x="392.0" y="185" fill="#dce2e7" font-size="24" text-anchor="start">10 guasti</text><text x="40" y="290" fill="#dce2e7" font-size="25" text-anchor="start">10.000 nodi</text><rect x="300" y="265" width="175.0" height="43" fill="#67c7ff"/><text x="487.0" y="295" fill="#dce2e7" font-size="24" text-anchor="start">100 guasti</text><text x="40" y="400" fill="#dce2e7" font-size="25" text-anchor="start">100.000 nodi</text><rect x="300" y="375" width="270.0" height="43" fill="#67c7ff"/><text x="582.0" y="405" fill="#dce2e7" font-size="24" text-anchor="start">1.000 guasti</text><text x="40" y="510" fill="#dce2e7" font-size="25" text-anchor="start">1.000.000 nodi</text><rect x="300" y="485" width="365.0" height="43" fill="#67c7ff"/><text x="677.0" y="515" fill="#dce2e7" font-size="24" text-anchor="start">10.000 guasti</text><text x="40" y="622" fill="#aab4be" font-size="23" text-anchor="start">Barre illustrative compresse; conteggi = N × 0,01.</text></g></svg>