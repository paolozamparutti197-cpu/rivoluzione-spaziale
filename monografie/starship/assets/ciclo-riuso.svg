<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 775" role="img" aria-labelledby="t d"><title id="t">DOPO IL RITORNO: IL CICLO DEL RIUSO</title><desc id="d">Nessuna durata, costo o quantità di manutenzione viene presunta.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67c7ff"/></marker></defs><rect width="1000" height="775" fill="#0c1520"/><g font-family="Arial,sans-serif"><text x="35" y="45" font-size="27" fill="#f3f5f7">DOPO IL RITORNO: IL CICLO DEL RIUSO</text><rect x="35" y="85" width="930" height="95" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="120" fill="#f5b941" font-size="24">1. Volo e recupero</text><text x="60" y="155" fill="#f3f5f7" font-size="20">Conservare il veicolo per poterlo esaminare.</text><path d="M500 183V204" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="210" width="930" height="95" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="245" fill="#f5b941" font-size="24">2. Ispezione</text><text x="60" y="280" fill="#f3f5f7" font-size="20">Struttura, motori, protezione e impianti.</text><path d="M500 308V329" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="335" width="930" height="95" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="370" fill="#f5b941" font-size="24">3. Interventi</text><text x="60" y="405" fill="#f3f5f7" font-size="20">Riparare, sostituire e verificare dove necessario.</text><path d="M500 433V454" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="460" width="930" height="95" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="495" fill="#f5b941" font-size="24">4. Accettazione</text><text x="60" y="530" fill="#f3f5f7" font-size="20">Decidere se il veicolo è idoneo al nuovo volo.</text><path d="M500 558V579" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="585" width="930" height="95" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="620" fill="#f5b941" font-size="24">5. Nuova missione</text><text x="60" y="655" fill="#f3f5f7" font-size="20">Il ciclo si ripete; la durata va misurata.</text><text x="35" y="720" font-size="17" fill="#aab4be">Nessuna durata, costo o quantità di manutenzione viene presunta.</text><text x="35" y="755" font-size="15" fill="#aab4be">Rivoluzione Spaziale · schema originale · CC BY 4.0</text></g></svg>