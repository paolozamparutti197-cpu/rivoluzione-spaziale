<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" role="img" aria-labelledby="t d"><title id="t">RIFORNIMENTO ORBITALE: LE DIPENDENZE</title><desc id="d">Architettura didattica: non è una dimostrazione già compiuta fra due Starship.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#67c7ff"/></marker></defs><rect width="1000" height="650" fill="#0c1520"/><g font-family="Arial,sans-serif"><text x="35" y="45" font-size="27" fill="#f3f5f7">RIFORNIMENTO ORBITALE: LE DIPENDENZE</text><rect x="35" y="85" width="930" height="95" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="120" fill="#f5b941" font-size="24">1. Lanci cisterna</text><text x="60" y="155" fill="#f3f5f7" font-size="20">Portare propellenti e apparati nell’orbita prevista.</text><path d="M500 183V204" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="210" width="930" height="95" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="245" fill="#f5b941" font-size="24">2. Incontro e connessione</text><text x="60" y="280" fill="#f3f5f7" font-size="20">Avvicinarsi, accoppiarsi, preparare le linee.</text><path d="M500 308V329" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="335" width="930" height="95" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="370" fill="#f5b941" font-size="24">3. Trasferimento e conservazione</text><text x="60" y="405" fill="#f3f5f7" font-size="20">Gestire temperatura, pressione, fluidi e perdite.</text><path d="M500 433V454" stroke="#67c7ff" stroke-width="3" marker-end="url(#a)"/><rect x="35" y="460" width="930" height="95" rx="8" fill="#132433" stroke="#496a7f"/><text x="60" y="495" fill="#f5b941" font-size="24">4. Partenza della nave di missione</text><text x="60" y="530" fill="#f3f5f7" font-size="20">Risorse verificate prima della manovra successiva.</text><text x="35" y="595" font-size="17" fill="#aab4be">Architettura didattica: non è una dimostrazione già compiuta fra due Starship.</text><text x="35" y="630" font-size="15" fill="#aab4be">Rivoluzione Spaziale · schema originale · CC BY 4.0</text></g></svg>