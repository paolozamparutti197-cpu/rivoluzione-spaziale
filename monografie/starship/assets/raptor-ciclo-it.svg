<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 760" role="img" aria-labelledby="title desc">
<title id="title">Ciclo full-flow: schema concettuale in italiano</title><desc id="desc">Il metano e l’ossigeno attraversano pompe e prebruciatori separati. I flussi ricchi di combustibile e ossigeno azionano turbine e arrivano nella camera principale. Sono presenti collegamenti incrociati; lo schema non rappresenta valvole e raffreddamento del Raptor reale.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L9,3 L0,6" fill="context-stroke"/></marker></defs>
<rect width="1000" height="760" fill="#0b1722"/>
<g fill="#112d40" stroke="#6bbfe8" stroke-width="2"><rect x="95" y="65" width="310" height="70" rx="8"/><rect x="595" y="65" width="310" height="70" rx="8"/><rect x="95" y="195" width="310" height="70" rx="8"/><rect x="595" y="195" width="310" height="70" rx="8"/><rect x="65" y="330" width="370" height="90" rx="8"/><rect x="565" y="330" width="370" height="90" rx="8"/><rect x="95" y="480" width="310" height="70" rx="8"/><rect x="595" y="480" width="310" height="70" rx="8"/><rect x="295" y="620" width="410" height="80" rx="8"/></g>
<g font-family="Arial,sans-serif" fill="white" font-size="24" text-anchor="middle"><text x="250" y="110">Metano liquido</text><text x="750" y="110">Ossigeno liquido</text><text x="250" y="238">Pompa combustibile</text><text x="750" y="238">Pompa ossidante</text><text x="250" y="370">Prebruciatore</text><text x="250" y="402" font-size="21">ricco di combustibile</text><text x="750" y="370">Prebruciatore</text><text x="750" y="402" font-size="21">ricco di ossigeno</text><text x="250" y="525">Turbina</text><text x="750" y="525">Turbina</text><text x="500" y="653">Camera principale</text><text x="500" y="684" font-size="20">combustione finale → ugello</text></g>
<g fill="none" stroke-width="5" marker-end="url(#arrow)"><path stroke="#f5b941" d="M250 135V187 M250 265V322 M250 420V472 M250 550V660H287"/><path stroke="#67c7ff" d="M750 135V187 M750 265V322 M750 420V472 M750 550V660H713"/><path stroke="#f5b941" stroke-width="3" d="M405 235H485V300H690V322"/><path stroke="#67c7ff" stroke-width="3" d="M595 245H515V310H310V322"/></g>
<g stroke="#bdc6cc" fill="none" stroke-width="2" stroke-dasharray="7 5"><path d="M95 515H40V230H95"/><path d="M905 515H960V230H905"/></g>
<g font-family="Arial,sans-serif" fill="#c6d5df" font-size="16"><text x="32" y="30">Schema originale: principi del ciclo, non disegno costruttivo SpaceX.</text><text x="32" y="735">Linee tratteggiate: accoppiamento meccanico turbina-pompa. Omesse valvole, avviamento e circuiti di raffreddamento.</text></g>
</svg>
