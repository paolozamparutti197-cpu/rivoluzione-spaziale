<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 500" role="img" aria-labelledby="t d"><title id="t">La missione come sistema di veicoli e infrastrutture</title><desc id="d">La fabbrica e le rampe alimentano i voli di navi e cisterne. In orbita si trasferiscono propellenti. La nave prosegue verso la destinazione. Il booster torna separatamente; il ritorno della nave dipende dalla missione.</desc><rect width="1100" height="500" fill="#0b1722"/><g stroke="#67c7ff" fill="#143144" stroke-width="2"><rect x="35" y="100" width="220" height="125" rx="8"/><rect x="325" y="100" width="220" height="125" rx="8"/><rect x="615" y="100" width="220" height="125" rx="8"/><rect x="880" y="100" width="185" height="125" rx="8"/><rect x="325" y="330" width="220" height="100" rx="8"/></g><g fill="white" font-family="Arial" text-anchor="middle" font-size="23"><text x="145" y="145">Fabbrica e rampe</text><text x="145" y="185" font-size="18">Terra</text><text x="435" y="145">Navi e cisterne</text><text x="435" y="185" font-size="18">Lanci ripetuti</text><text x="725" y="145">Rifornimento</text><text x="725" y="185" font-size="18">Orbita terrestre</text><text x="973" y="145">Destinazione</text><text x="973" y="185" font-size="18">Luna / Marte</text><text x="435" y="370">Booster</text><text x="435" y="405" font-size="18">Ritorno separato</text></g><g stroke="#f5b941" fill="none" stroke-width="5"><path d="M255 162H315M545 162H605M835 162H870M435 225V320"/></g><g fill="#f5b941"><path d="M315 154L325 162L315 170M605 154L615 162L605 170M870 154L880 162L870 170M427 320L435 330L443 320"/></g><text x="35" y="40" fill="#d1dce3" font-family="Arial" font-size="20">Architettura concettuale: il rifornimento non è richiesto per ogni missione orbitale.</text><text x="35" y="478" fill="#d1dce3" font-family="Arial" font-size="18">Schema originale. Nessuna quantità fissa di cisterne: dipende dalla missione e dalle prestazioni effettive.</text></svg>
