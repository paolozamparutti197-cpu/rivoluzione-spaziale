<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">Stazioni a terra Starlink · rete funzionale</title><desc id="desc">Terminale utente, satellite e gateway sono nodi diversi. Il traffico può raggiungere il gateway direttamente oppure attraverso satelliti collegati da laser; poi attraversa la rete terrestre verso la destinazione.</desc><defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#67d5df"/></marker><marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#efbd78"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#f4f6f3;font-size:24px}.heading{font-size:30px;font-weight:bold}.small{font-size:20px;fill:#cad9df}.tiny{font-size:17px;fill:#cad9df}.box{fill:#1c3544;stroke:#547b8c;stroke-width:2}.flow{fill:none;stroke:#67d5df;stroke-width:3;marker-end:url(#flow)}.pressure{fill:none;stroke:#efbd78;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#heat)}</style><rect width="1000" height="820" fill="#11232f"/><text x="30" y="48" class="heading">Stazioni a terra Starlink · rete funzionale</text><rect class="box" x="30" y="120" width="300" height="86" rx="5"/><text x="46" y="150" >Satellite A</text><text x="46" y="178" class="small">Accesso dell’utente</text><rect class="box" x="670" y="120" width="300" height="86" rx="5"/><text x="686" y="150" >Satellite B</text><text x="686" y="178" class="small">Collegamento al gateway</text><rect class="box" x="30" y="410" width="300" height="86" rx="5"/><text x="46" y="440" >Terminale utente</text><text x="46" y="468" class="small">Collegamento radio</text><rect class="box" x="670" y="410" width="300" height="86" rx="5"/><text x="686" y="440" >Gateway terrestre</text><text x="686" y="468" class="small">Collegamento radio</text><rect class="box" x="355" y="645" width="290" height="86" rx="5"/><text x="371" y="675" >Rete terrestre</text><text x="371" y="703" class="small">Destinazione dei dati</text><path class="flow" d="M330 163H670" marker-start="url(#flow)" stroke-dasharray="10 6"/><text x="360" y="135" class="tiny">Laser, se disponibili</text><path class="flow" d="M180 206V410" marker-start="url(#flow)" /><path class="flow" d="M820 206V410" marker-start="url(#flow)" /><path class="flow" d="M820 496V688H645" marker-start="url(#flow)" /><path d="M330 183L680 410" fill="none" stroke="#a5bbc6" stroke-width="2" stroke-dasharray="8 6" marker-start="url(#flow)" marker-end="url(#flow)"/><text x="420" y="370" class="tiny">Alternativa: radio diretta</text><text x="30" y="780" class="small">Il percorso laser non sostituisce il collegamento radio con l’utente.</text></svg>