<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 510" role="img" aria-labelledby="title desc"><title id="title">Architettura funzionale</title><desc id="desc">Satelliti in orbita → Generazioni coexistenti → Collegamenti fra nodi → Terminale utente → Gateway e rete terrestre → Hardware, servizio e autorizzazioni distinti</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#5ce0d5"/></marker></defs><style>svg{background:#101e29}rect{fill:#1e3442;stroke:#5ce0d5;stroke-width:1.5}text{font:17px Arial,sans-serif;fill:#f4f5f0;dominant-baseline:middle}.small{font-size:14px;fill:#c6d7dc}path{fill:none;stroke:#5ce0d5;stroke-width:2.5}.outline{fill:#2d4551;stroke:#f4f5f0}.tank{fill:#285861}.fire{fill:#eeb369;stroke:#eeb369}.earth{fill:#285c73;stroke:#7bcbdf}.orbit{stroke-dasharray:6 8;stroke:#8096a0}.accent{stroke:#eeb369}</style><text x="28" y="28">Starlink: generazioni dei satelliti</text><circle class="earth" cx="320" cy="369" r="106"/><path class="orbit" d="M 70 218 Q 320 -30 570 218"/><rect x="42" y="119" width="166" height="64" rx="9"/><text x="125" y="140.5" text-anchor="middle">Satelliti in</text><text x="125" y="161.5" text-anchor="middle">orbita</text><rect x="237" y="58" width="166" height="64" rx="9"/><text x="320" y="79.5" text-anchor="middle">Generazioni</text><text x="320" y="100.5" text-anchor="middle">coesistenti</text><rect x="432" y="119" width="166" height="64" rx="9"/><text x="515" y="140.5" text-anchor="middle">Collegamenti fra</text><text x="515" y="161.5" text-anchor="middle">nodi</text><rect x="33" y="345" width="166" height="64" rx="9"/><text x="116" y="377" text-anchor="middle">Terminale utente</text><rect x="442" y="345" width="166" height="64" rx="9"/><text x="525" y="366.5" text-anchor="middle">Gateway e rete</text><text x="525" y="387.5" text-anchor="middle">terrestre</text><path  d="M 208 143 L 237 107" marker-end="url(#arrow)"/><path  d="M 403 107 L 432 143" marker-end="url(#arrow)"/><path  d="M 126 183 L 116 345" marker-end="url(#arrow)"/><path  d="M 515 183 L 525 345" marker-end="url(#arrow)"/><text class="small" x="320" y="369" text-anchor="middle">Terra</text><text class="small" x="320" y="468" text-anchor="middle">Hardware, servizio e autorizzazioni distinti</text><text class="small" x="320" y="496" text-anchor="middle">Schema didattico originale · non in scala</text></svg>