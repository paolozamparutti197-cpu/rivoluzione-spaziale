<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">Calcolo orbitale · tre circuiti</title><desc id="desc">Energia solare e accumulo alimentano il calcolo. Il calcolo scambia dati con la rete ottica e cede calore al circuito termico e ai radiatori. Non è una singola catena sequenziale.</desc><defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#67d5df"/></marker><marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#efbd78"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#f4f6f3;font-size:24px}.heading{font-size:30px;font-weight:bold}.small{font-size:20px;fill:#cad9df}.tiny{font-size:17px;fill:#cad9df}.box{fill:#1c3544;stroke:#547b8c;stroke-width:2}.flow{fill:none;stroke:#67d5df;stroke-width:3;marker-end:url(#flow)}.pressure{fill:none;stroke:#efbd78;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#heat)}</style><rect width="1000" height="820" fill="#11232f"/><text x="30" y="48" class="heading">Calcolo orbitale · tre circuiti</text><rect class="box" x="30" y="140" width="320" height="86" rx="5"/><text x="46" y="170" >Generazione solare</text><rect class="box" x="650" y="140" width="320" height="86" rx="5"/><text x="666" y="170" >Distribuzione / accumulo</text><rect class="box" x="350" y="350" width="300" height="86" rx="5"/><text x="366" y="380" >Processori e memoria</text><rect class="box" x="30" y="570" width="320" height="86" rx="5"/><text x="46" y="600" >Rete ottica</text><text x="46" y="628" class="small">Scambio di dati</text><rect class="box" x="650" y="570" width="320" height="86" rx="5"/><text x="666" y="600" >Circuito termico</text><text x="666" y="628" class="small">Radiatori verso lo spazio</text><path class="flow" d="M350 183H650"/><path class="flow" d="M810 226V390H650"/><path class="flow" d="M350 393H190V570" marker-start="url(#flow)" /><path class="pressure" d="M650 393H810V570"/><text x="30" y="760" class="small">Azzurro: energia e dati (percorsi distinti). Oro: calore.</text><text x="30" y="795" class="small">Il radiatore smaltisce calore: non è una fase successiva della rete dati.</text></svg>