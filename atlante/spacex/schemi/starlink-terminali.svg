<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">Terminali Starlink · rete funzionale</title><desc id="desc">Dispositivi locali e router comunicano con l’antenna Starlink, che si collega via radio ai satelliti disponibili. Il satellite si collega alla rete terrestre, direttamente o attraverso altri satelliti.</desc><defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#67d5df"/></marker><marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#efbd78"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#f4f6f3;font-size:24px}.heading{font-size:30px;font-weight:bold}.small{font-size:20px;fill:#cad9df}.tiny{font-size:17px;fill:#cad9df}.box{fill:#1c3544;stroke:#547b8c;stroke-width:2}.flow{fill:none;stroke:#67d5df;stroke-width:3;marker-end:url(#flow)}.pressure{fill:none;stroke:#efbd78;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#heat)}</style><rect width="1000" height="820" fill="#11232f"/><text x="30" y="48" class="heading">Terminali Starlink · rete funzionale</text><rect class="box" x="45" y="110" width="390" height="86" rx="5"/><text x="61" y="140" >Dispositivi e rete locale</text><rect class="box" x="565" y="110" width="390" height="86" rx="5"/><text x="581" y="140" >Router</text><rect class="box" x="565" y="330" width="390" height="86" rx="5"/><text x="581" y="360" >Antenna Starlink</text><text x="581" y="388" class="small">Inseguimento elettronico</text><rect class="box" x="45" y="330" width="390" height="86" rx="5"/><text x="61" y="360" >Satellite disponibile</text><text x="61" y="388" class="small">Accesso radio</text><rect class="box" x="45" y="580" width="390" height="86" rx="5"/><text x="61" y="610" >Rete verso destinazione</text><text x="61" y="638" class="small">Gateway e/o laser</text><path class="flow" d="M435 153H565" marker-start="url(#flow)" /><path class="flow" d="M760 196V330" marker-start="url(#flow)" /><path class="flow" d="M565 373H435" marker-start="url(#flow)" /><path class="flow" d="M240 416V580" marker-start="url(#flow)" /><text x="30" y="745" class="small">Antenna e router sono apparati diversi; il passaggio di satellite è dinamico.</text><text x="30" y="780" class="small">Ostacoli, alimentazione e configurazione locale influiscono sul servizio.</text></svg>