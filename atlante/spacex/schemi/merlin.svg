<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">Merlin · circuito funzionale</title><desc id="desc">LOX e RP-1 alimentano le pompe e la camera principale. Una parte dei propellenti alimenta il generatore di gas; il gas aziona la turbina e non ritorna nella camera principale. L’albero collega turbina e pompe.</desc><defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#67d5df"/></marker><marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#efbd78"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#f4f6f3;font-size:24px}.heading{font-size:30px;font-weight:bold}.small{font-size:20px;fill:#cad9df}.tiny{font-size:17px;fill:#cad9df}.box{fill:#1c3544;stroke:#547b8c;stroke-width:2}.flow{fill:none;stroke:#67d5df;stroke-width:3;marker-end:url(#flow)}.pressure{fill:none;stroke:#efbd78;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#heat)}</style><rect width="1000" height="820" fill="#11232f"/><text x="30" y="48" class="heading">Merlin · circuito funzionale</text><rect class="box" x="40" y="110" width="300" height="86" rx="5"/><text x="56" y="140" >Ossigeno liquido</text><text x="56" y="168" class="small">Serbatoio LOX</text><rect class="box" x="660" y="110" width="300" height="86" rx="5"/><text x="676" y="140" >Cherosene</text><text x="676" y="168" class="small">Serbatoio RP-1</text><rect class="box" x="40" y="280" width="300" height="86" rx="5"/><text x="56" y="310" >Pompa ossidante</text><rect class="box" x="660" y="280" width="300" height="86" rx="5"/><text x="676" y="310" >Pompa combustibile</text><rect class="box" x="350" y="390" width="300" height="86" rx="5"/><text x="366" y="420" >Generatore di gas</text><text x="366" y="448" class="small">Solo parte dei flussi</text><rect class="box" x="350" y="530" width="300" height="86" rx="5"/><text x="366" y="560" >Turbina</text><text x="366" y="588" class="small">Aziona le pompe</text><rect class="box" x="40" y="660" width="300" height="86" rx="5"/><text x="56" y="690" >Camera principale</text><text x="56" y="718" class="small">Ugello propulsivo</text><rect class="box" x="660" y="660" width="300" height="86" rx="5"/><text x="676" y="690" >Scarico del gas</text><text x="676" y="718" class="small">Fuori dalla camera</text><path class="flow" d="M190 196 V280"/><path class="flow" d="M810 196 V280"/><path class="flow" d="M190 366 V660"/><path class="flow" d="M810 366 V620 H275 V660"/><path class="flow" d="M190 400 H350 V430"/><path class="flow" d="M810 400 H650 V430"/><path class="flow" d="M500 476 V530"/><path class="flow" d="M650 573 H810 V660"/><path d="M350 573H310V322H340 M650 573H690V370H960V322" fill="none" stroke="#efbd78" stroke-width="3" stroke-dasharray="8 6"/><text x="340" y="245" class="tiny">Tratteggio: collegamento meccanico</text><text x="30" y="790" class="small">Ciclo aperto a generatore di gas · scarico separato dalla camera principale</text></svg>