<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">Raptor · circuito funzionale</title><desc id="desc">Due pompe e due precombustori, uno ricco di ossigeno e uno ricco di metano. Entrambi i flussi attraversano le turbine e raggiungono la camera principale; piccole alimentazioni incrociate consentono la combustione nei precombustori.</desc><defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#67d5df"/></marker><marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#efbd78"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#f4f6f3;font-size:24px}.heading{font-size:30px;font-weight:bold}.small{font-size:20px;fill:#cad9df}.tiny{font-size:17px;fill:#cad9df}.box{fill:#1c3544;stroke:#547b8c;stroke-width:2}.flow{fill:none;stroke:#67d5df;stroke-width:3;marker-end:url(#flow)}.pressure{fill:none;stroke:#efbd78;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#heat)}</style><rect width="1000" height="820" fill="#11232f"/><text x="30" y="48" class="heading">Raptor · circuito funzionale</text><rect class="box" x="35" y="105" width="360" height="86" rx="5"/><text x="51" y="135" >Ossigeno liquido</text><text x="51" y="163" class="small">Pompa ossidante</text><rect class="box" x="605" y="105" width="360" height="86" rx="5"/><text x="621" y="135" >Metano liquido</text><text x="621" y="163" class="small">Pompa combustibile</text><rect class="box" x="35" y="315" width="360" height="86" rx="5"/><text x="51" y="345" >Precombustore</text><text x="51" y="373" class="small">Ricco di ossigeno</text><rect class="box" x="605" y="315" width="360" height="86" rx="5"/><text x="621" y="345" >Precombustore</text><text x="621" y="373" class="small">Ricco di metano</text><rect class="box" x="35" y="505" width="360" height="86" rx="5"/><text x="51" y="535" >Turbina lato ossidante</text><rect class="box" x="605" y="505" width="360" height="86" rx="5"/><text x="621" y="535" >Turbina lato combustibile</text><rect class="box" x="330" y="665" width="340" height="86" rx="5"/><text x="346" y="695" >Camera principale</text><text x="346" y="723" class="small">Combustione finale</text><path class="flow" d="M215 191 V315"/><path class="flow" d="M785 191 V315"/><path class="flow" d="M215 401 V505"/><path class="flow" d="M785 401 V505"/><path class="flow" d="M215 591 V708 H330"/><path class="flow" d="M785 591 V708 H670"/><path class="flow" d="M215 230 H470 V285 H675 V315"/><path class="flow" d="M785 245 H530 V270 H325 V315"/><text x="365" y="215" class="tiny">Alimentazioni incrociate</text><text x="30" y="797" class="small">Full-flow: entrambi i flussi arrivano alla camera · albero pompe omesso</text></svg>