<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">Direct to Cell · rete funzionale</title><desc id="desc">Telefono compatibile comunica via radio con un satellite Direct to Cell; la rete spaziale si collega all’infrastruttura terrestre e al core dell’operatore mobile. Non è richiesto un terminale domestico Starlink.</desc><defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#67d5df"/></marker><marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#efbd78"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#f4f6f3;font-size:24px}.heading{font-size:30px;font-weight:bold}.small{font-size:20px;fill:#cad9df}.tiny{font-size:17px;fill:#cad9df}.box{fill:#1c3544;stroke:#547b8c;stroke-width:2}.flow{fill:none;stroke:#67d5df;stroke-width:3;marker-end:url(#flow)}.pressure{fill:none;stroke:#efbd78;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#heat)}</style><rect width="1000" height="820" fill="#11232f"/><text x="30" y="48" class="heading">Direct to Cell · rete funzionale</text><rect class="box" x="55" y="125" width="365" height="86" rx="5"/><text x="71" y="155" >Telefono compatibile</text><text x="71" y="183" class="small">Accesso radio mobile</text><rect class="box" x="580" y="125" width="365" height="86" rx="5"/><text x="596" y="155" >Satellite Direct to Cell</text><text x="596" y="183" class="small">Accesso dallo spazio</text><rect class="box" x="580" y="365" width="365" height="86" rx="5"/><text x="596" y="395" >Rete spaziale / gateway</text><text x="596" y="423" class="small">Trasporto verso terra</text><rect class="box" x="55" y="365" width="365" height="86" rx="5"/><text x="71" y="395" >Core operatore mobile</text><text x="71" y="423" class="small">Autenticazione e servizi</text><rect class="box" x="55" y="605" width="365" height="86" rx="5"/><text x="71" y="635" >Destinazione</text><text x="71" y="663" class="small">Internet o rete telefonica</text><path class="flow" d="M420 168H580" marker-start="url(#flow)" /><path class="flow" d="M762 211V365" marker-start="url(#flow)" /><path class="flow" d="M580 408H420" marker-start="url(#flow)" /><path class="flow" d="M237 451V605" marker-start="url(#flow)" /><text x="30" y="765" class="small">Il partner mobile non è un satellite: qui è un nodo terrestre.</text><text x="30" y="795" class="small">Frequenze, compatibilità e servizi dipendono dalle autorizzazioni locali.</text></svg>