<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 840" role="img" aria-labelledby="title desc"><title id="title">Recupero Starship · percorsi separati</title><desc id="desc">Dopo la separazione, Super Heavy ritorna lungo il proprio profilo mentre Ship prosegue la missione e affronta un rientro separato. Ispezione e qualifica al rivolo sono valutate per ciascun veicolo.</desc><defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#67d5df"/></marker><marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#efbd78"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#f4f6f3;font-size:24px}.heading{font-size:30px;font-weight:bold}.small{font-size:20px;fill:#cad9df}.tiny{font-size:17px;fill:#cad9df}.box{fill:#1c3544;stroke:#547b8c;stroke-width:2}.flow{fill:none;stroke:#67d5df;stroke-width:3;marker-end:url(#flow)}.pressure{fill:none;stroke:#efbd78;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#heat)}</style><rect width="1000" height="840" fill="#11232f"/><text x="30" y="48" class="heading">Recupero Starship · percorsi separati</text><rect class="box" x="320" y="100" width="360" height="86" rx="5"/><text x="336" y="130" >Separazione degli stadi</text><rect class="box" x="35" y="300" width="400" height="86" rx="5"/><text x="51" y="330" >Super Heavy</text><text x="51" y="358" class="small">Profilo di ritorno del booster</text><rect class="box" x="565" y="300" width="400" height="86" rx="5"/><text x="581" y="330" >Ship</text><text x="581" y="358" class="small">Prosegue la propria missione</text><rect class="box" x="35" y="500" width="400" height="86" rx="5"/><text x="51" y="530" >Ritorno del booster</text><text x="51" y="558" class="small">Cattura / esito del test</text><rect class="box" x="565" y="500" width="400" height="86" rx="5"/><text x="581" y="530" >Rientro della nave</text><text x="581" y="558" class="small">Zona prevista / esito del test</text><rect class="box" x="35" y="690" width="400" height="86" rx="5"/><text x="51" y="720" >Ispezione del booster</text><text x="51" y="748" class="small">Eventuale qualifica al rivolo</text><rect class="box" x="565" y="690" width="400" height="86" rx="5"/><text x="581" y="720" >Ispezione della nave</text><text x="581" y="748" class="small">Eventuale qualifica al rivolo</text><path class="flow" d="M400 186V240H235V300"/><path class="flow" d="M600 186V240H765V300"/><path class="flow" d="M235 386V500"/><path class="flow" d="M765 386V500"/><path class="flow" d="M235 586V690"/><path class="flow" d="M765 586V690"/></svg>