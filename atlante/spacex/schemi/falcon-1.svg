<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc"><title id="title">Falcon 1 · due stadi, due motori</title><desc id="desc">Carenatura sopra il secondo stadio; Kestrel nel secondo stadio; interstadio; primo stadio con un Merlin. Disegno funzionale, non una sezione costruttiva.</desc><defs><marker id="flow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M0 0L8 4L0 8Z" fill="#67d5df"/></marker><marker id="heat" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#efbd78"/></marker></defs><style>text{font-family:Arial,sans-serif;fill:#f4f6f3;font-size:24px}.heading{font-size:30px;font-weight:bold}.small{font-size:20px;fill:#cad9df}.tiny{font-size:17px;fill:#cad9df}.box{fill:#1c3544;stroke:#547b8c;stroke-width:2}.flow{fill:none;stroke:#67d5df;stroke-width:3;marker-end:url(#flow)}.pressure{fill:none;stroke:#efbd78;stroke-width:3;stroke-dasharray:8 6;marker-end:url(#heat)}</style><rect width="1000" height="820" fill="#11232f"/><text x="30" y="48" class="heading">Falcon 1 · due stadi, due motori</text><path d="M430 178 Q465 65 500 178Z" fill="#dce5e8" stroke="#7d9aaa" stroke-width="2"/><rect x="430" y="178" width="70" height="138" fill="#dce5e8"/><rect x="430" y="316" width="70" height="66" fill="#273a48"/><rect x="430" y="382" width="70" height="275" fill="#dce5e8"/><path d="M450 303L443 326L487 326L480 303Z M450 650L443 681L487 681L480 650Z" fill="#efbd78" stroke="#11232f" stroke-width="2"/><text x="135" y="143" >Carenatura</text><path d="M345 136L430 145" stroke="#67d5df" stroke-width="2"/><circle cx="430" cy="145" r="4" fill="#67d5df"/><text x="660" y="220" >Secondo stadio</text><path d="M640 213L500 220" stroke="#67d5df" stroke-width="2"/><circle cx="500" cy="220" r="4" fill="#67d5df"/><text x="135" y="310" >Kestrel</text><path d="M345 303L453 312" stroke="#67d5df" stroke-width="2"/><circle cx="453" cy="312" r="4" fill="#67d5df"/><text x="660" y="356" >Interstadio</text><path d="M640 349L500 353" stroke="#67d5df" stroke-width="2"/><circle cx="500" cy="353" r="4" fill="#67d5df"/><text x="135" y="508" >Primo stadio</text><path d="M345 501L430 505" stroke="#67d5df" stroke-width="2"/><circle cx="430" cy="505" r="4" fill="#67d5df"/><text x="660" y="675" >Un Merlin</text><path d="M640 668L480 662" stroke="#67d5df" stroke-width="2"/><circle cx="480" cy="662" r="4" fill="#67d5df"/><text x="30" y="760" class="small">Posizioni funzionali: non in scala, non un disegno di officina.</text><text x="30" y="797" class="small">Kestrel: alimentazione pressurizzata. Merlin: ciclo a generatore di gas.</text></svg>